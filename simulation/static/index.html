<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Virtual Labs | Image Processing Lab</title>
    <style>
      body { font-family: Arial, sans-serif; margin:20px; background:#f7f7f7; }
      .container{max-width:980px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
      .row{display:flex;gap:16px;align-items:flex-start}
      canvas{border:1px solid #ccc;background:#222;}
      label{display:block;font-weight:600;margin-top:8px}
      .controls{min-width:260px}
      .btn{display:inline-block;margin-top:10px;padding:8px 12px;border-radius:6px;border:0;background:#1473e6;color:#fff;cursor:pointer}
      .small{font-size:13px}
      pre{background:#f2f6fb;padding:8px;border-radius:6px;overflow:auto}
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Image Sampling & Quantization — Simulation</h2>
      <p class="small">Use the controls to change sampling grid size and number of quantization levels. Click <strong>Apply</strong> to run, and <strong>Save Report</strong> to attach a snapshot to progress report.</p>

      <div class="row">
        <div style="flex:1">
          <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
            <div>
              <label for="sampleSize">Sample cell size (px)</label>
              <input id="sampleSize" type="range" min="2" max="40" value="8">
            </div>
            <div>
              <label for="quantLevels">Quantization levels</label>
              <input id="quantLevels" type="number" min="2" max="256" value="8" style="width:88px">
            </div>
          </div>

          <div style="display:flex;gap:12px;">
            <canvas id="sourceCanvas" width="512" height="256"></canvas>
            <canvas id="outputCanvas" width="512" height="256"></canvas>
          </div>
        </div>

        <aside class="controls">
          <label>Actions</label>
          <button id="applyBtn" class="btn">Apply</button>
          <button id="resetBtn" class="btn" style="background:#6b7280">Reset</button>
          <button id="saveReportBtn" class="btn" style="background:#059669">Save Report</button>

          <div style="margin-top:16px">
            <label>Preview (output data URL)</label>
            <pre id="dataUrlPreview" style="height:120px"></pre>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const src = document.getElementById('sourceCanvas');
      const out = document.getElementById('outputCanvas');
      const sCtx = src.getContext('2d');
      const oCtx = out.getContext('2d');
      const sampleSizeEl = document.getElementById('sampleSize');
      const quantLevelsEl = document.getElementById('quantLevels');
      const applyBtn = document.getElementById('applyBtn');
      const resetBtn = document.getElementById('resetBtn');
      const saveReportBtn = document.getElementById('saveReportBtn');
      const dataUrlPreview = document.getElementById('dataUrlPreview');

      function drawSource(){
        const w = src.width, h = src.height;
        // draw horizontal gradient + checker overlay
        const g = sCtx.createLinearGradient(0,0,w,0);
        g.addColorStop(0,'#111'); g.addColorStop(0.3,'#444'); g.addColorStop(0.6,'#bbb'); g.addColorStop(1,'#fff');
        sCtx.fillStyle = g; sCtx.fillRect(0,0,w,h);
        // checker
        const size=16; sCtx.globalAlpha=0.08;
        for(let y=0;y<h;y+=size){ for(let x=0;x<w;x+=size){ sCtx.fillStyle = ((x+y)/size)%2? '#000':'#fff'; sCtx.fillRect(x,y,size/2,size/2); }}
        sCtx.globalAlpha=1;
      }

      function quantize(value, levels){
        const step = 255/(levels-1);
        return Math.round(value/step)*step;
      }

      function applySamplingAndQuantization(){
        const ss = Number(sampleSizeEl.value);
        const levels = Math.max(2, Math.min(256, Number(quantLevelsEl.value)||8));
        const sw = src.width, sh = src.height;
        const img = sCtx.getImageData(0,0,sw,sh);
        oCtx.clearRect(0,0,out.width,out.height);
        for(let y=0;y<sh;y+=ss){
          for(let x=0;x<sw;x+=ss){
            let r=0,g=0,b=0,c=0;
            for(let yy=0; yy<ss; yy++){
              for(let xx=0; xx<ss; xx++){
                const px = x+xx; const py = y+yy;
                if(px>=sw||py>=sh) continue;
                const idx = (py*sw+px)*4;
                r+=img.data[idx]; g+=img.data[idx+1]; b+=img.data[idx+2]; c++;
              }
            }
            if(c===0) continue;
            const av = Math.round((r+g+b)/(3*c));
            const q = quantize(av, levels);
            oCtx.fillStyle = `rgb(${q},${q},${q})`;
            oCtx.fillRect(x, y, ss, ss);
            // optional grid
            oCtx.strokeStyle = 'rgba(0,0,0,0.08)'; oCtx.strokeRect(x+0.5,y+0.5,ss-1,ss-1);
          }
        }
        dataUrlPreview.textContent = out.toDataURL('image/png').slice(0,200) + '...';
      }

      function resetSimulation(){ drawSource(); oCtx.clearRect(0,0,out.width,out.height); dataUrlPreview.textContent=''; }

      function saveReport(){
        const reportDate = new Date().toLocaleString();
        const imgData = out.toDataURL('image/png');
        const html = `<!doctype html><html><head><meta charset="utf-8"><title>Simulation Report</title></head><body><h2>Image Processing Lab</h2><p><strong>Experiment:</strong> To demonstrate and understand image sampling and quantization</p><p><strong>Generated:</strong> ${reportDate}</p><h3>Output</h3><img src="${imgData}" style="max-width:100%;border:1px solid #ccc"/></body></html>`;
        try{
          localStorage.setItem('vlab_exp2_simulation_report_html', html);
          localStorage.setItem('vlab_exp2_simulation_report_updated_at', new Date().toISOString());
          alert('Simulation report saved to progress report store.');
        }catch(e){ alert('Unable to save report: '+e.message); }
      }

      applyBtn.addEventListener('click', applySamplingAndQuantization);
      resetBtn.addEventListener('click', resetSimulation);
      saveReportBtn.addEventListener('click', saveReport);

      // init
      drawSource();
    </script>
  </body>
</html>
